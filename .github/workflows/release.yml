# Build platform-specific .vsix artifacts. Publishing to the Marketplace is
# intentionally NOT automated here (it needs a VSCE_PAT); run
# `npx @vscode/vsce publish --packagePath <file>` locally instead, or install
# the .vsix directly.
name: Build VSIX

on:
  workflow_dispatch:
    inputs:
      tpix_cli_version:
        description: "tpix-cli release tag to bundle"
        required: false
        default: v0.15.1
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: build-vsix-${{ github.ref }}
  cancel-in-progress: false

env:
  TPIX_CLI_VERSION_DEFAULT: v0.15.1

jobs:
  verify:
    name: Type-check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run check

      - name: Fetch tpix CLI for tests
        run: scripts/fetch-tpix.sh linux-x64 "${{ github.event.inputs.tpix_cli_version || env.TPIX_CLI_VERSION_DEFAULT }}"

      - run: npm test

  package:
    name: Package ${{ matrix.target }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - win32-x64
          - linux-x64
          - linux-arm64
          - darwin-x64
          - darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch tpix CLI
        run: scripts/fetch-tpix.sh ${{ matrix.target }} "${{ github.event.inputs.tpix_cli_version || env.TPIX_CLI_VERSION_DEFAULT }}"

      - run: scripts/package.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: tpix-vscode-${{ matrix.target }}
          path: "*.vsix"
          if-no-files-found: error
          retention-days: 30

  attach:
    name: Attach .vsix to GitHub release
    needs: package
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.vsix
