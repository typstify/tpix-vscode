# Build one universal .vsix that bundles the tpix CLI for every supported
# platform (bin/<target>/). Publishing to the Marketplace is intentionally NOT
# automated here (it needs a VSCE_PAT / the web upload); download the artifact
# and publish it yourself.
name: Build VSIX

on:
  workflow_dispatch:
    inputs:
      tpix_cli_version:
        description: "tpix-cli release tag to bundle (must contain tpix.exe for Windows, e.g. v0.15.1)"
        required: false
        default: v0.15.0
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: build-vsix-${{ github.ref }}
  cancel-in-progress: false

env:
  # Bump this to bundle a newer tpix-cli. It must be a release whose Windows
  # asset contains tpix.exe: v0.15.0 predates the Makefile fix that names it
  # correctly, so the build will fail on it by design.
  TPIX_CLI_VERSION_DEFAULT: v0.15.0

jobs:
  build:
    name: Build universal VSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run check

      - name: Fetch tpix CLI for all platforms
        run: scripts/fetch-all-tpix.sh "${{ github.event.inputs.tpix_cli_version || env.TPIX_CLI_VERSION_DEFAULT }}"

      - run: npm test

      - run: scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tpix-vscode-vsix
          path: "*.vsix"
          if-no-files-found: error
          retention-days: 30

  attach:
    name: Attach .vsix to GitHub release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.vsix
